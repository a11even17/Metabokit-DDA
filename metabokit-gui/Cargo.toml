[workspace]
resolver = "2"
members = ["crates/metabokit-core", "crates/metabokit-app"]

[workspace.package]
version = "0.2.1"
edition = "2021"
rust-version = "1.77"
license = "MIT"

# Versions are carried over from the 0.1 CLI manifest, which is a known-good
# resolution set for this project.
[workspace.dependencies]
base64 = "0.22.1"
bytemuck = "1"
csv = "1.4.0"
flate2 = "1.1.9"
glob = "0.3.3"
memmap2 = "0.9"
quick-xml = "0.41.0"
rayon = "1.12.0"
regex = "1.13.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1.3"

# The engine is numeric and allocation-sensitive: fat LTO plus a single codegen
# unit lets the optimiser inline across the mzML decoder / CWT / scoring
# boundaries, which is where essentially all of the runtime lives.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
incremental = false

# Debug builds still have to chew through multi-gigabyte mzML files; without
# this, iterating on the UI against real data is unusable.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
